name: Backend CI / CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest & NDCG Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: recruit_admin
          POSTGRES_PASSWORD: recruit_password
          POSTGRES_DB: recruit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations (Alembic)
        env:
          DATABASE_URL: postgresql://recruit_admin:recruit_password@localhost:5432/recruit_db
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run Pytest Suite with Quality Gates
        env:
          DATABASE_URL: postgresql://recruit_admin:recruit_password@localhost:5432/recruit_db
          AI_PROVIDER: mock
          PYTHONPATH: ${{ github.workspace }}/backend
        working-directory: ./backend
        run: |
          pytest tests -v --tb=short
