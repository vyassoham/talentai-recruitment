version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruit_password}
      POSTGRES_DB: ${POSTGRES_DB:-recruit_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruit_admin} -d ${POSTGRES_DB:-recruit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    environment:
      CLAMAV_NO_FRESHCLAM: "false"
    volumes:
      - clamavdata:/var/lib/clamav

volumes:
  pgdata:
  redisdata:
  clamavdata:
